# ── JVM ───────────────────────────────────────────────────────────────────────
# 2 GB is plenty for this module and leaves room for games and a browser on a
# 16 GB laptop. Raise it if a build ever runs out; do not raise it pre-emptively.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Kotlin/Native downloads a ~1 GB toolchain the first time an iOS target is
# built. On Windows nothing here builds those targets, so this costs nothing
# locally and matters only on the macOS runner.
kotlin.native.ignoreDisabledTargets=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Required before any Android module can exist. AndroidX is the modern support
# library; the flag turns off the pre-2018 one. New projects have this from the
# start, and this one did not because it had no Android module until now.
android.useAndroidX=true
android.nonTransitiveRClass=true
